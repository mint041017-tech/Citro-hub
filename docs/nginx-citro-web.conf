# Citro Flutter Web：将以下指令放进站点 server {} 中。
# 前提：已安装 gzip_static 模块，并让 .wasm 使用 application/wasm MIME。

gzip on;
gzip_static on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml font/ttf font/otf;

# 入口文件不能长缓存，否则发版后仍会加载旧版 main.dart.js。
location = /index.html {
  add_header Cache-Control "no-cache, must-revalidate";
}
location = /flutter_bootstrap.js {
  add_header Cache-Control "no-cache, must-revalidate";
}
location = /main.dart.js {
  add_header Cache-Control "no-cache, must-revalidate";
}
location ~ ^/assets/(FontManifest\.json|AssetManifest\.) {
  add_header Cache-Control "no-cache, must-revalidate";
}

# CanvasKit 由 Flutter 版本决定，避免长时间 immutable 缓存。
location /canvaskit/ {
  types {
    application/wasm wasm;
    application/javascript js;
  }
  add_header Cache-Control "public, max-age=604800";
}

# 图片和字体文件名稳定，缓存久一些以减少重复下载。
location ~* ^/assets/.*\.(png|jpe?g|webp|gif|woff2?|otf|ttf)$ {
  add_header Cache-Control "public, max-age=2592000";
}
location /icons/ {
  add_header Cache-Control "public, max-age=2592000";
}

# 原版 Hash 路由和静态页面都回落到 index.html。
location / {
  try_files $uri $uri/ /index.html;
}
