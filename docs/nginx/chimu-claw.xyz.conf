server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name chimu-claw.xyz www.chimu-claw.xyz;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/chimu-claw.xyz;

    #GZIP-START 静态压缩（已确认 nginx 编译含 with-http_gzip_static_module）
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml font/ttf font/otf;
    #GZIP-END

    #FLUTTER-WEB-START 入口与构建产物不缓存，统一用 expires -1（保留 server 级 HSTS/Alt-Svc 继承）
    location = /index.html { expires -1; }
    location = /main.dart.js { expires -1; }
    location = /flutter_bootstrap.js { expires -1; }
    location = /flutter_service_worker.js { expires -1; }
    location = /manifest.json { expires -1; }
    location = /version.json { expires -1; }
    location ~ ^/assets/(FontManifest\.json|AssetManifest\.) { expires -1; }

    location ^~ /canvaskit/ {
        types {
            application/wasm wasm;
            application/javascript js;
        }
        expires 7d;
    }

    location ~* ^/assets/.*\.(png|jpe?g|webp|gif|svg|woff2?|ttf|otf)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }
    location /icons/ { expires 30d; }
    location = /favicon.png { expires 30d; }

    location / {
        try_files $uri $uri/ /index.html;
    }
    #FLUTTER-WEB-END
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/chimu-claw.xyz.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/chimu-claw.xyz/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/chimu-claw.xyz/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/chimu-claw.xyz/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;

    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    #引用反向代理规则，注释后配置的反向代理将无效
    include /www/server/panel/vhost/nginx/proxy/chimu-claw.xyz/*.conf;

    include enable-php-82.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/chimu-claw.xyz.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~* \.(gif|jpe?g|png|bmp|webp|swf|svg)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~* \.(js|css)$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~* \.(woff2?|ttf|otf)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/chimu-claw.xyz.log;
    error_log  /www/wwwlogs/chimu-claw.xyz.error.log;
}