name: iOS and iPadOS TestFlight

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Serialize releases so TestFlight build numbers are allocated in upload order.
concurrency:
  group: citro-testflight
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      deployment: ${{ steps.release.outputs.deployment }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release triggers
        run: python3 -m unittest discover -s flutter/tool -p test_ci_release_metadata.py
      - name: Validate source and version
        id: metadata
        run: python3 flutter/tool/ci_release_metadata.py
      - name: Skip commits already uploaded and record deployment
        id: release
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = process.env.SOURCE_SHA;
            if (context.eventName !== 'workflow_dispatch') {
              const deployments = await github.paginate(github.rest.repos.listDeployments, {
                owner, repo, sha, environment: 'testflight', per_page: 100
              });
              for (const deployment of deployments) {
                const {data: statuses} = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: deployment.id, per_page: 100
                });
                if (statuses.some(status => status.state === 'success')) {
                  core.notice('This commit has already been uploaded to TestFlight.');
                  core.setOutput('publish', 'false');
                  return;
                }
                if (statuses.some(status => status.description?.startsWith('Upload started') || status.description?.startsWith('Upload outcome uncertain'))) {
                  throw new Error('An earlier upload outcome is uncertain. Check App Store Connect, then retry manually if needed.');
                }
              }
            }
            const {data: deployment} = await github.rest.repos.createDeployment({
              owner, repo, ref: sha, environment: 'testflight', auto_merge: false,
              required_contexts: [], production_environment: false
            });
            core.setOutput('deployment', String(deployment.id));
            core.setOutput('publish', 'true');

  testflight:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: testflight
    defaults:
      run:
        working-directory: flutter
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      APPLE_TEAM_ID: 3F78UC4868
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Check signing secrets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          missing=0
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISIONING_PROFILES_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Select accepted Xcode
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | tail -n 1)" = 'Build version 27A9275'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          architecture: arm64
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: flutter
          bundler-cache: true
      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test push bindings
        run: flutter test --no-pub test/push_binding_test.dart test/ai_proxy_test.dart test/compliance_smoke_test.dart
      - name: Archive and validate universal IPA
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bundle exec fastlane ios archive_release
      - name: Record upload attempt before contacting Apple
        id: attempt
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ needs.prepare.outputs.deployment }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: 'in_progress', auto_inactive: false,
              description: 'Upload started; verify Apple before retrying an interrupted run.'
            });
      - name: Upload to TestFlight
        id: upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bundle exec fastlane ios upload_release
      - name: Record upload result
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ needs.prepare.outputs.deployment }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ATTEMPT_OUTCOME: ${{ steps.attempt.outcome }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.UPLOAD_OUTCOME === 'success' ? 'success' : 'failure',
              auto_inactive: false,
              description: process.env.UPLOAD_OUTCOME === 'success'
                ? 'Uploaded to TestFlight; Apple processing is separate.'
                : process.env.ATTEMPT_OUTCOME === 'success'
                  ? 'Upload outcome uncertain; check Apple before manual retry.' : 'Build failed before upload.',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Save IPA and upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citro-testflight-${{ github.run_number }}
          path: |
            flutter/build/ci/*.ipa
            flutter/build/ci/receipt.json
            flutter/build/ci/*.dSYM.zip
          if-no-files-found: ignore
          retention-days: 14
