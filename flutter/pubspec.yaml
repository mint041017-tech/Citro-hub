name: citro
description: "Citro App — 原生 Widget 实现（v1.9.2）"
publish_to: 'none'

# 版本规则：versionCode = major*1000 + minor*100 + patch（1.7.8 → 1708）
version: 1.9.2+1902

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  crypto: ^3.0.7
  flutter_svg: ^2.0.17
  lpinyin: ^2.0.3
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  image: ^4.12.0
  record: ^7.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  share_plus: ^10.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_inappwebview: ^6.1.5
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  web: ^1.1.2
  flutter_staggered_grid_view: ^0.7.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash_image.jpg
    - assets/splash_landscape.jpg
    - assets/images/
    - assets/images/mods/
    - assets/images/cats/
    # 每日打卡卡背（素材/card 压缩为 1200×1600 WebP）
    - assets/card/
    # 极限刹车原始版（shache.org，three.js 构建产物）——用 WebView 内嵌
    - assets/shache/
    # 咕噜果冻铺 Web 版（flutter_inappwebview 内嵌）
    - assets/liquid2048/
    - assets/liquid2048/js/
    # 铃渡（Knockwater）原生音效
    - assets/knockwater/audio/
  fonts:
    - family: Kalam
      fonts:
        - asset: assets/fonts/kalam-400-app.ttf
          weight: 400
        - asset: assets/fonts/kalam-700-app.ttf
          weight: 700
    - family: ZCOOL
      fonts:
        - asset: assets/fonts/zcool-app.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/caveat-app.ttf
    - family: NotoSC
      fonts:
        - asset: assets/fonts/noto-sc-400-app.otf
          weight: 400
        - asset: assets/fonts/noto-sc-700-app.otf
          weight: 700

# shared_preferences_android 2.5.0/2.5.1 在 release(R8) 下会因 coroutine 类名被裁剪而
# NoSuchMethodError，表现为启动即卡死/打不开。2.5.2 已带 consumer proguard 规则。
dependency_overrides:
  shared_preferences_android: 2.5.2
  # Windows WebView2 的 DXGI 纹理在本机显示空白，内嵌副本改用 CPU 纹理并收紧承载窗口。
  flutter_inappwebview_windows:
    path: packages/flutter_inappwebview_windows
