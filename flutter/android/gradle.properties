# 整机只有 16G：Gradle 之前开到 8G 堆 + 4G Metaspace，构建峰值会和模拟器、
# 编辑器一起把 Windows 顶进内存/供电压力区。压到 3G 堆、768M Metaspace，
# 关闭常驻 daemon，构建结束即释放；并发降到 2，避免 CPU/供电瞬时拉满。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── 中文路径兼容（同 kotlin/gradle.properties 的踩坑结论）──
# 工程路径含中文（C:\网站web\Citro）。Windows 上 sun.jnu.encoding 默认跟随系统
# ANSI 代码页（GBK），无法表示中文目录名，Kotlin 编译进程会把源码路径转义成
# C:/u7F51/u7AD9web/... 从而报 "source file or directory not found"。
# 配合 flutter/build.js 注入的 JAVA_TOOL_OPTIONS（UTF-8 路径编码）一起生效。
kotlin.compiler.execution.strategy=in-process

# AGP 9+ 对非 ASCII 工程路径默认硬拦截。本工程（kotlin/ 兄弟目录）在同样
# 中文路径下已连续构建 7+ 个正式版本（UTF-8 JVM 参数 + Kotlin in-process
# 编译策略），路径本身可构建，故显式关掉该检查。
android.overridePathCheck=true

# 中文路径 + Windows 文件锁：Kotlin 增量缓存偶发无法关闭（v1.1.3 起显式关闭增量）
kotlin.incremental=false

# 通知小图标按资源名在运行时查找，必须关闭 AGP 资源名混淆/压缩
android.enableResourceOptimizations=false
